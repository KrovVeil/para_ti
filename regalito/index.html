<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
/* ===== PALETAS POR APARTADO (colores sacados de cada fondo) ===== */
.t0{--card:rgba(8,22,60,.55);--ink:#fff;--ink2:#ffd978;--line:#7fb3ff;--btn:#ff5a5f;--blue:#2a63d6;--sh:rgba(0,0,20,.45)}
.t1{--card:rgba(255,255,255,.62);--ink:#c2185b;--ink2:#7b1fa2;--line:#f06292;--btn:#ec407a;--blue:#ab6df0;--sh:rgba(150,40,110,.3)}
.t2{--card:rgba(40,10,80,.58);--ink:#f6e0ff;--ink2:#ff9de6;--line:#c77dff;--btn:#ff4fb8;--blue:#7b2cbf;--sh:rgba(20,0,50,.5)}
.t3{--card:rgba(255,255,255,.6);--ink:#1f4fa0;--ink2:#d9402f;--line:#5b8fd8;--btn:#e0453a;--blue:#4c8be0;--sh:rgba(30,70,140,.3)}
.t4{--card:rgba(14,30,66,.6);--ink:#eaf2ff;--ink2:#ffb4a2;--line:#6f9be0;--btn:#f2788a;--blue:#2f5ca8;--sh:rgba(0,10,40,.5)}
.t5{--card:rgba(255,255,255,.62);--ink:#6a1fb0;--ink2:#d6207a;--line:#b266ff;--btn:#e0239a;--blue:#3b82f6;--sh:rgba(90,30,150,.3)}
.t6{--card:rgba(10,10,22,.6);--ink:#fff;--ink2:#ffc2e6;--line:#ff8fd0;--btn:#ff5fb0;--blue:#7a5cff;--sh:rgba(0,0,0,.55)}
.t7{--card:rgba(255,248,240,.66);--ink:#a8431f;--ink2:#1b7fa8;--line:#f08a5d;--btn:#e8643a;--blue:#ee7d4b;--sh:rgba(170,80,30,.3)}
.t8{--card:rgba(255,240,244,.64);--ink:#a3122f;--ink2:#6b0f2a;--line:#e0506f;--btn:#c8183b;--blue:#d8456a;--sh:rgba(140,20,50,.3)}
.t9{--card:rgba(50,10,90,.58);--ink:#fff;--ink2:#ffe27a;--line:#ff7ad9;--btn:#ff3fa4;--blue:#7c3aed;--sh:rgba(20,0,50,.5)}
body{margin:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;display:flex;justify-content:center;align-items:stretch;padding:30px 12px 8px;font-family:"Libre Baskerville",Georgia,serif;color:var(--ink);background:#1a1a2e}
.bgl{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;animation:bgin .9s both}
@keyframes bgin{from{opacity:0;transform:scale(1.06)}}
.wrap{width:100%;max-width:980px;height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.card{background:var(--card);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--line);border-radius:28px;padding:26px 34px 16px;box-shadow:0 10px 30px var(--sh);flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card>*{position:relative;z-index:1}
.love{position:absolute;top:-22px;left:-6px;font-family:"Homemade Apple",cursive;color:#fff;text-shadow:0 2px 10px #0009;font-size:42px;transform:rotate(-8deg);pointer-events:none;z-index:2}
.fit{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:safe center}
.zin{display:flex;flex-direction:column;flex:none}
h1,h2{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;margin:0;text-align:center;line-height:1.05}
h1{font-size:clamp(34px,8vh,64px)}h2{font-size:clamp(30px,6vh,50px)}
.sub{font-family:"Cormorant Garamond",serif;font-style:italic;text-align:center;font-size:clamp(16px,2.6vh,22px);margin:8px 0 14px;color:var(--ink2)}
.body{font-size:17px;line-height:1.85;text-align:justify;hyphens:auto;padding:2px 4px}
.body p{margin:0 0 12px}
.hand{font-family:"Homemade Apple",cursive;font-size:14px;line-height:2}
.center{text-align:center}
nav{display:flex;justify-content:center;gap:18px;margin-top:12px;align-items:center}
nav button{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:21px;letter-spacing:.04em;border-radius:999px;padding:10px 34px;cursor:pointer;position:relative;border:1.5px solid var(--line);background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .25s cubic-bezier(.2,1.5,.4,1),box-shadow .25s,opacity .25s}
nav button:hover:not(:disabled){transform:translateY(-4px) scale(1.07);box-shadow:0 10px 18px var(--sh)}
nav button:active:not(:disabled){transform:translateY(3px) scale(.93);box-shadow:0 1px 0 var(--line)}
nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
nav button:disabled{opacity:.35;cursor:default}
nav button.next{background:var(--btn);border-color:var(--btn);color:#fff;box-shadow:0 4px 0 #0005;animation:glow 2s ease-in-out infinite}
nav button.next:disabled{animation:none}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #0005,0 0 0 0 var(--btn)}60%{box-shadow:0 4px 0 #0005,0 0 0 12px transparent}}
nav button.next::after{content:" →";display:inline-block;animation:ndg 1.2s ease-in-out infinite}
nav button#back::before{content:"← ";display:inline-block;animation:ndb 1.2s ease-in-out infinite}
@keyframes ndg{50%{transform:translateX(6px)}}@keyframes ndb{50%{transform:translateX(-6px)}}
.dots{display:flex;justify-content:center;gap:6px;margin:8px auto 0;padding:6px 12px;border-radius:999px;background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.35;transition:.3s}.dots i.on{opacity:1;background:var(--btn);transform:scale(1.3)}
.lock{display:block;margin:14px auto 6px;animation:flt 3.6s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}
.cal{background:var(--blue);padding:20px 26px 18px;margin:10px auto 0;border-radius:18px;max-width:700px;width:100%;color:#fff;
-webkit-mask:radial-gradient(circle 6px at 50% 0,#0000 98%,#000) top/20px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) bottom/20px 51% repeat-x;mask:radial-gradient(circle 6px at 50% 0,#0000 98%,#000) top/20px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) bottom/20px 51% repeat-x}
.cal b{display:block;font:italic 600 38px "Cormorant Garamond",serif;text-align:center;margin-bottom:6px}
.cal table{width:100%;border-collapse:collapse;font:17px "Libre Baskerville",serif;text-align:center}
.cal td,.cal th{padding:11px 0;border-bottom:1px solid #ffffff55;font-weight:400}
.cal td.m span{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:var(--btn);color:#fff;clip-path:path("M14 26 C-6 11 4 -2 14 6 C24 -2 34 11 14 26Z");padding-top:2px;cursor:pointer;animation:beat 1.4s ease-in-out infinite}
.bp{position:absolute!important;z-index:6!important;pointer-events:none;font-size:20px;animation:bp .95s ease-out forwards}
@keyframes bp{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--r));opacity:0}}
.list20{columns:2;column-gap:14px;list-style:none;padding:0;margin:0;line-height:1.4;text-align:left;counter-reset:n}
.list20 li{break-inside:avoid;position:relative;counter-increment:n;padding:9px 12px 9px 54px;margin-bottom:10px;font-size:16px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 5px 14px var(--sh);color:var(--ink);transition:transform .25s,box-shadow .25s}
.list20 li:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 20px var(--sh)}
.list20 li::before{content:counter(n);position:absolute;left:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--btn);color:#fff;font:600 15px "Cormorant Garamond",serif;display:flex;align-items:center;justify-content:center}
.stars{display:flex;justify-content:center;gap:16px;font-size:28px;color:#f0b44a;margin:12px 0 18px}
.stars span{animation:tws 1.9s ease-in-out infinite;animation-delay:var(--d)}
@keyframes tws{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.3) rotate(20deg)}}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pol{background:#fff;border:1px solid var(--line);padding:9px;border-radius:4px;cursor:pointer;box-shadow:0 4px 10px var(--sh);color:#8a3a46}
.pol:nth-child(odd){transform:rotate(-2deg)}.pol:nth-child(even){transform:rotate(2deg)}
.pol .ph{aspect-ratio:1;background:#dce9f7 center/cover;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:6px;color:#5a7ab0}
.cols h3{font:italic 600 22px "Cormorant Garamond",serif;margin:8px 0 4px;text-align:left;color:var(--ink2)}
.cols ul{margin:0 0 6px;padding-left:18px;font-size:14px;line-height:1.7;text-align:left}
.prom{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;line-height:1.55;text-align:left;background:var(--card)}
.prom em{flex:none;font-style:normal;font-size:20px}
.acro div{display:flex;gap:12px;align-items:baseline;margin-bottom:9px;text-align:left;font-size:17px;line-height:1.5}
.acro b{font:italic 600 42px "Cormorant Garamond",serif;width:36px;flex:none;color:var(--btn)}
.sun{width:150px;height:150px;margin:0 auto;display:block;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:beat 1.6s ease-in-out infinite;display:inline-block}
@keyframes beat{50%{transform:scale(1.15)}}
.mail{display:inline-block;font-size:42px;animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.15)}}
.card.fwd{animation:wipeF .85s cubic-bezier(.65,0,.35,1)}.card.bwd{animation:wipeB .85s cubic-bezier(.65,0,.35,1)}
@keyframes wipeF{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeB{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.card::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(100deg,transparent 35%,#ffffff70 50%,transparent 65%);transform:translateX(-130%)}
.card.fwd::after{animation:shineF .9s .05s ease-in}.card.bwd::after{animation:shineB .9s .05s ease-in}
@keyframes shineF{to{transform:translateX(130%)}}@keyframes shineB{from{transform:translateX(130%)}to{transform:translateX(-130%)}}
.card h1,.card h2{animation:rise .9s .55s backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.pop{animation:pop .65s calc(var(--d,0ms) + 700ms) backwards cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.85)}}
.ch{opacity:0;animation:chin .2s forwards}
@keyframes chin{to{opacity:1}}
.fl{position:absolute!important;z-index:0!important;bottom:-30px;opacity:.4;pointer-events:none;animation:upf linear infinite}
@keyframes upf{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.45}90%{opacity:.35}100%{transform:translateY(-680px) rotate(25deg);opacity:0}}
@media (min-width:900px){.list20{columns:3}}
@media (min-width:700px){.photos{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.card{padding:22px 14px 12px}h1{font-size:44px}h2{font-size:36px}.body{font-size:16px}.list20{columns:2;column-gap:8px}.list20 li{padding:7px 8px 7px 38px;font-size:13px;margin-bottom:7px;border-radius:12px}.list20 li::before{left:7px;width:24px;height:24px;font-size:12px}}
@media (prefers-reduced-motion:reduce){.fl,.stars span,.mail,.lock,.sun,.pulse,.card,.card::after,.card h1,.card h2,.pop,.bgl,.cal td.m span,nav button.next,nav button.next::after,nav button#back::before{animation:none!important}.ch{opacity:1;animation:none}}
.letter{display:flex;justify-content:center;margin-top:6px}
.letter img{max-height:calc(100dvh - 250px);max-width:100%;width:auto;border-radius:14px;box-shadow:0 8px 24px var(--sh);cursor:zoom-in}
.gal{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:10px;max-height:calc(100dvh - 290px);min-height:120px;overflow-y:auto;padding:8px 6px;scrollbar-width:thin}

.gal img:hover{transform:scale(1.08) rotate(-1deg)}
.eyesub{font-family:"Dancing Script",cursive;font-weight:700;font-size:clamp(24px,4.4vh,38px);text-align:center;margin:8px 0 0;color:var(--ink2);line-height:1.2}
.eyes2{display:flex;justify-content:center;gap:clamp(14px,4vw,46px);margin-top:6px}
.hf{position:relative;padding:20px}
.hf img{display:block;height:clamp(100px,22vh,240px);max-width:40vw;width:auto;border-radius:12px;cursor:zoom-in;box-shadow:0 6px 16px var(--sh)}
.hf .h{position:absolute;font-style:normal;font-size:20px;transform:translate(-50%,-50%);animation:hb 1.6s ease-in-out infinite}
@keyframes hb{50%{transform:translate(-50%,-50%) scale(1.35)}}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
#lb[hidden]{display:none}
#lb .lbs{width:96vw;height:88vh;overflow:auto;display:flex}

#lb button{position:absolute;background:#ffffff26;color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:26px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#lb .lbx{top:calc(env(safe-area-inset-top,0px) + 10px);right:14px}

.hid{visibility:hidden}
.body{hyphens:manual}

.lt{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,64px)}

@media (max-width:560px){.list20{columns:auto;gap:7px 8px}}

.mus{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}

 card.onclick=e=>{const g=e.target.closest("[data-g]");if(g){openLB(g.dataset.g,+g.dataset.i);return}window._skip&&window._skip();card.querySelectorAll(".late").forEach(x=>x.style.animation="none")};

 window._skip=()=>{cancelAnimationFrame(window._tw);show(total)};

/* ===== MÚSICA: fondo + canciones con letra ===== */
const bgm=new Audio(C.musicaFondo);bgm.loop=true;bgm.volume=0;bgm.preload="auto";
let bgOn=true,cur=null,curK=-1,raf=0;const au={},LY={};
const playing=()=>cur&&!cur.paused;
const fmt=x=>isFinite(x)?Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0"):"0:00";
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fade=(a,to,ms,fn)=>{clearInterval(a._f);const f=a.volume,t0=performance.now();a._f=setInterval(()=>{const q=Math.min(1,(performance.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,f+(to-f)*q));if(q>=1){clearInterval(a._f);fn&&fn()}},40)};
function bgStart(){if(!bgOn||playing()||!bgm.paused)return Promise.resolve(false);return bgm.play().then(()=>{fade(bgm,C.volFondo,900);return true}).catch(()=>false)}
function bgStop(){if(bgm.paused)return;fade(bgm,0,500,()=>bgm.pause())}
function bgBack(){if(!playing())bgStart()}
function unlock(){bgStart().then(ok=>{if(ok)["click","touchend","keydown"].forEach(x=>removeEventListener(x,unlock))})}
["click","touchend","keydown"].forEach(x=>addEventListener(x,unlock));
const muteB=document.getElementById("mute");muteB.onclick=()=>{bgOn=!bgOn;muteB.textContent=bgOn?"🔊":"🔇";bgOn?bgStart():bgStop()};
function getLy(k){if(LY[k])return LY[k];const re=/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;let out=[],timed=false;
 (C.canciones[k].letra||"").split(/\r?\n/).forEach(l=>{const ts=[];let m;re.lastIndex=0;while((m=re.exec(l)))ts.push(+m[1]*60+ +m[2]+(m[3]?+("0."+m[3]):0));const x=l.replace(re,"").trim();
  if(ts.length){timed=true;ts.forEach(t=>out.push({t,x:x||"♪"}))}else if(x&&!/^\[[a-z]{2,}:/i.test(x))out.push({t:null,x})});
 if(timed)out=out.filter(o=>o.t!==null).sort((a,b)=>a.t-b.t);
 return LY[k]={a:out,ready:timed}}
function spread(L,dur,k){const c=C.canciones[k],s=c.inicio||0,e=dur-(c.fin||0),n=L.a.length;L.a.forEach((o,i)=>o.t=s+(e-s)*i/n);L.ready=true}
function buildLy(k){const el=document.getElementById("lyr");if(!el)return;const L=getLy(k);
 if(!L.a.length){el.innerHTML='<p class="cur">Letra próximamente 💗</p>';return}
 el.innerHTML='<div class="lin">'+L.a.map((o,i)=>`<p data-i="${i}">${esc(o.x)}</p>`).join("")+"</div>";el.scrollTop=0}
function setLy(L,idx){const el=document.getElementById("lyr");if(!el)return;const ps=el.querySelectorAll("p[data-i]");if(!ps.length)return;
 ps.forEach((p,j)=>{p.className=j<idx?"past":j===idx?"cur":""});
 const c=idx>=0?ps[idx]:null;el.scrollTo({top:c?Math.max(0,c.offsetTop-el.clientHeight*0.3):0,behavior:"smooth"})}
function mark(k,on){const r=document.querySelector(`.song[data-k="${k}"]`);if(!r)return;r.classList.toggle("pp",on);r.classList.toggle("on",k===curK);const b=r.querySelector(".pl");b.textContent=on?"❚❚":"▶";b.setAttribute("aria-label",(on?"Pausar ":"Reproducir ")+C.canciones[k].titulo)}
function tick(){if(!cur)return;const k=curK,L=getLy(k),t=cur.currentTime;if(!L.ready&&isFinite(cur.duration)&&L.a.length)spread(L,cur.duration,k);
 const r=document.querySelector(`.song[data-k="${k}"]`);if(r){r.querySelector(".bar i").style.width=(cur.duration?t/cur.duration*100:0)+"%";r.querySelector(".tm").textContent=fmt(t)}
 if(L.ready){const tt=t+(C.canciones[k].ajuste||0);let idx=-1;for(let j=0;j<L.a.length;j++){if(L.a[j].t<=tt)idx=j;else break}if(idx!==tick.last){tick.last=idx;setLy(L,idx)}}
 raf=requestAnimationFrame(tick)}
function toggleSong(k){
 if(cur&&curK===k){if(playing()){cur.pause();cancelAnimationFrame(raf);mark(k,false);bgBack();return}}
 else{if(cur){cur.pause();cancelAnimationFrame(raf);const o=curK;curK=k;mark(o,false)}
  curK=k;cur=au[k]||(au[k]=new Audio(C.canciones[k].archivo));cur.preload="metadata";
  cur.onended=()=>{cancelAnimationFrame(raf);mark(k,false);const r=document.querySelector(`.song[data-k="${k}"]`);if(r)r.querySelector(".bar i").style.width="0";bgBack()};
  tick.last=null;buildLy(k)}
 bgStop();
 cur.play().then(()=>{mark(k,true);raf=requestAnimationFrame(tick)}).catch(()=>{mark(k,false);bgBack();const el=document.getElementById("lyr");if(el)el.innerHTML=`<p class="cur">No encontré el audio 😢</p><p>${esc(C.canciones[k].archivo)}</p><p>Revisa que esté en la carpeta "audio" y con ese nombre exacto.</p>`})}
function stopSong(){if(cur){cur.pause();cancelAnimationFrame(raf);cur=null;curK=-1}bgBack()}
card.addEventListener("click",e=>{
 const pl=e.target.closest(".pl");if(pl){toggleSong(+pl.closest(".song").dataset.k);return}
 const bar=e.target.closest(".bar");if(bar){const k=+bar.closest(".song").dataset.k;if(curK===k&&cur&&isFinite(cur.duration)){const q=bar.getBoundingClientRect();cur.currentTime=Math.max(0,Math.min(1,(e.clientX-q.left)/q.width))*cur.duration;tick.last=null}return}
 const ln=e.target.closest(".lyr p[data-i]");if(ln){if(cur&&isFinite(cur.duration)){const L=getLy(curK);if(L.ready){const i2=+ln.dataset.i;cur.currentTime=Math.max(0,L.a[i2].t-(C.canciones[curK].ajuste||0));tick.last=i2;setLy(L,i2)}}return}
 const mb=e.target.closest("#more");if(mb){const s7=card.querySelector(".s7");s7.classList.toggle("more");mb.textContent=s7.classList.contains("more")?"← volver a las canciones":"ver más recuerdos →";fit()}

const intro=document.getElementById("intro"),ino=document.getElementById("ino"),iyes=document.getElementById("iyes"),isub=document.getElementById("isub"),ISUB0=isub.textContent;
let introOn=true,dodges=0,noDone=false,ox=0,oy=0;const PDODGE=.78,DIST=62; // probabilidad de escaparse en cada intento y distancia (siempre la misma)
const sb=m=>{const p=[];for(let k=0;k<m*2;k++){const r=k%2?44:50,a=k*Math.PI/m;p.push(`${(50+r*Math.cos(a)).toFixed(1)}% ${(50+r*Math.sin(a)).toFixed(1)}%`)}return `polygon(${p.join(",")})`};
ino.style.clipPath=iyes.style.clipPath=sb(22);
ino.addEventListener("pointerenter",e=>{if(noDone||Math.random()>PDODGE)return;dodges++;
 const r=ino.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let vx=cx-(e.clientX??cx),vy=cy-(e.clientY??cy);const d=Math.hypot(vx,vy)||1;vx/=d;vy/=d;
 let nx=ox+vx*DIST,ny=oy+vy*DIST;if(nx<-110||nx>8)nx=ox-vx*DIST;if(ny<-80||ny>80)ny=oy-vy*DIST;ox=Math.max(-110,Math.min(8,nx));oy=Math.max(-80,Math.min(80,ny));
 ino.style.transform=`translate(${ox}px,${oy}px) rotate(${(dodges%2?1:-1)*14}deg)`});
ino.onclick=()=>{if(noDone)return;noDone=true;isub.textContent="WAAAA AMOR PORFAVOR MIRALO://";isub.classList.remove("shake");void isub.offsetWidth;isub.classList.add("shake","beg");ino.classList.add("gone");iyes.classList.add("big");setTimeout(()=>{ino.style.display="none"},320)};
function hearts(el){const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let k=0;k<36;k++){const h=document.createElement("span"),a=Math.random()*6.283,d=120+Math.random()*340;h.className="hb";h.textContent=["💗","💖","💕","❤️","💝","✨"][k%6];h.style.cssText=`left:${x}px;top:${y}px;font-size:${18+Math.random()*28}px;animation-duration:${1+Math.random()*1}s;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-80}px;--r:${(Math.random()-.5)*160}deg`;document.body.appendChild(h);setTimeout(()=>h.remove(),2200)}}
iyes.onclick=()=>{hearts(iyes);introOn=false;setTimeout(()=>{intro.classList.add("out");dir=1;i=0;render()},900)};
function showIntro(){cancelAnimationFrame(window._tw);stopSong();closeLB();noDone=false;dodges=0;ox=oy=0;ino.style.transform="";ino.style.display="";ino.classList.remove("gone");iyes.classList.remove("big");isub.textContent=ISUB0;isub.classList.remove("shake","beg");introOn=true;i=0;dir=1;intro.classList.remove("out")}
